plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

def target = findProperty('target')?.toString()
if (target != null) {
    if (!(target in ['26.1', '26.2'])) throw new GradleException("Unsupported compatibility target: ${target}")
    def profile = new Properties()
    file("compat/${target}.properties").withInputStream { profile.load(it) }
    profile.each { key, value -> project.ext.set(key.toString(), value.toString()) }
    if(project.hasProperty('testMinecraft')) {
        def game=project.property('testMinecraft').toString()
        if(!(game in ['26.1','26.1.1','26.1.2','26.2']))throw new GradleException("Unsupported test client: ${game}")
        project.ext.set('minecraft_version',game)
    }
    layout.buildDirectory = file("build/compat-${project.minecraft_version}")
}
def compat = target != null
def dependencyDir = compat ? 'libs/compat' : 'libs'
def apiModules = compat ? "libs/compat/fabric-api-modules-${project.fabric_api_version}" : project.fabric_api_version == '0.161.0+26.3' ? 'libs/fabric-api-modules' : "libs/fabric-api-modules-${project.fabric_api_version}"
def metadata = [version: project.mod_version,
                game_range: compat ? project.game_range : '>=26.3 <26.4',
                litematica_range: compat ? project.litematica_range : '>=0.29.1 <0.30.0',
                malilib_range: compat ? project.malilib_range : '>=0.30.2 <0.31.0',
                fabric_range: compat ? project.fabric_range : '>=0.161.0']
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        if (!project.hasProperty('binaryUnderTest')) {
            litematicainventories {
                sourceSet sourceSets.client
            }
        }
    }
}

dependencies {
    if (project.hasProperty('binaryUnderTest')) { runtimeOnly files(project.property('binaryUnderTest')) }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation files("${dependencyDir}/fabric-api-${project.fabric_api_version}.jar")
    compileOnly fileTree(dir: apiModules, include: '*.jar')
    implementation files(compat ? "${dependencyDir}/${project.litematica_jar}" : 'libs/litematica-fabric-26.3-0.29.1.jar')
    implementation files(compat ? "${dependencyDir}/${project.malilib_jar}" : 'libs/malilib-fabric-26.3-0.30.2.jar')
    compileOnly files(compat ? "${dependencyDir}/${project.modmenu_jar}" : 'libs/modmenu-21.0.0.jar')
    if (project.hasProperty('withChestTracker')) { runtimeOnly fileTree(dir: 'libs/integration', include: '*.jar') }
    if (project.hasProperty('withModMenu')) { runtimeOnly files(compat ? "${dependencyDir}/${project.modmenu_jar}" : 'libs/modmenu-21.0.0.jar') }
}

processResources {
    inputs.properties metadata
    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

tasks.named('processClientResources', ProcessResources) {
    inputs.properties metadata
    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}


sourceSets {
    logicTest { java.srcDir 'src/logicTest/java'; compileClasspath += sourceSets.client.output; runtimeClasspath += sourceSets.client.output }
}
tasks.register('logicTest', JavaExec) {
    dependsOn tasks.named('compileLogicTestJava')
    classpath = sourceSets.logicTest.runtimeClasspath
    mainClass = 'dev.asaul.litematicainventories.LogicTests'
}
tasks.named('check') { dependsOn tasks.named('logicTest') }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }


sourceSets {
    smoke { compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath; runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath }
}
if (project.hasProperty('integrationTests')) {
    loom {
        mods { storagepreviewtests { sourceSet sourceSets.smoke } }
        runs {
            smoke { client(); source sourceSets.smoke; runDir 'run-smoke'; vmArg '-Xmx2G'; vmArg '-Dmixin.debug.export=true' }
        }
    }
}

if (compat) {
    // Keep one maintained implementation; only adapt renamed version-specific APIs.
    apply from: 'compat/sources.gradle'
}
if (project.hasProperty('binaryUnderTest')) {
    sourceSets.smoke.runtimeClasspath = sourceSets.smoke.runtimeClasspath.minus(sourceSets.client.output)
    loom.runs.smoke.vmArg "-Dstorages.binaryUnderTest=${file(project.property('binaryUnderTest')).absolutePath}"
}




if (project.hasProperty('integrationTests')) {
tasks.named('runSmoke') {
    doFirst { java.nio.file.Files.deleteIfExists(file('run-smoke/smoke-result.txt').toPath()) }
    doLast {
        def result = file('run-smoke/smoke-result.txt')
        if (!result.exists() || result.text.contains('FAIL') || !result.text.contains('LIVE PASS: container')) {
            throw new GradleException('Minecraft integration checks failed; inspect run-smoke/smoke-result.txt and logs/latest.log')
        }
    }
}

}
